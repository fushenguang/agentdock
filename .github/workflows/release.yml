# Release — triggered on every push to main.
# Uses Changesets to manage versioning across all publishable packages.
#
# Two modes (handled automatically by changesets/action):
#   1. .changeset/*.md files exist  → opens/updates a "Version Packages" PR
#   2. "Version Packages" PR merged → bumps versions + publishes changed packages to npm
#
# Which packages get published is determined entirely by Changesets based on
# which .changeset entries were present — NOT by this workflow file.
# Do NOT create per-package release workflows; Changesets is the single source of truth.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release in progress — partial publishes leave packages in an inconsistent state.
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create release PRs and tags
      pull-requests: write # open "Version Packages" PR

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets needs full history for changelog

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # Authenticate against npm registry for publishing
          registry-url: https://registry.npmjs.org

      # CLI package uses `bun build`. Install the same version from npm instead
      # of downloading a GitHub release, which has produced repeated 504s.
      - name: Install Bun
        run: npm install --global bun@1.4.4

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      # A prior run can create the version tag before npm exposes the package.
      # Recover that state explicitly so Changesets does not fail on a duplicate tag.
      - name: Recover tagged npm CLI release
        id: npm_recovery
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/cli/package.json').version")"
          package="@cogito.ai/cli@${version}"
          echo "skip_changesets=false" >> "$GITHUB_OUTPUT"

          if npm view "$package" version >/dev/null 2>&1; then
            echo "$package is publicly available on npm"
            exit 0
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$package" >/dev/null; then
            exit 0
          fi

          echo "$package has a git tag but is missing from npm; publishing explicitly"
          npm publish ./packages/cli --access public --tag latest

          for attempt in {1..12}; do
            if npm view "$package" version >/dev/null 2>&1; then
              echo "skip_changesets=true" >> "$GITHUB_OUTPUT"
              echo "$package is publicly available on npm"
              exit 0
            fi
            sleep 5
          done

          echo "::error::$package is still missing from npm after explicit publish"
          exit 1

      # changesets/action does two things depending on state:
      #  1. If .changeset/*.md files exist → opens/updates a "Version Packages" PR
      #  2. If "Version Packages" PR is merged → publishes to npm
      - name: Publish or open version PR
        if: steps.npm_recovery.outputs.skip_changesets != 'true'
        uses: changesets/action@v1
        with:
          publish: pnpm changeset:publish
          version: pnpm changeset:version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN must be added as a repository secret:
          # Settings → Secrets and variables → Actions → New repository secret
          # Name: NPM_TOKEN
          # Value: npm token with "Automation" type (publish scope)
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm CLI release
        if: steps.npm_recovery.outputs.skip_changesets != 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/cli/package.json').version")"
          package="@cogito.ai/cli@${version}"

          if npm view "$package" version >/dev/null 2>&1; then
            echo "$package is publicly available on npm"
            exit 0
          fi

          echo "$package is missing from npm after Changesets; publishing explicitly"
          npm publish ./packages/cli --access public --tag latest

          for attempt in {1..12}; do
            if npm view "$package" version >/dev/null 2>&1; then
              echo "$package is publicly available on npm"
              exit 0
            fi
            sleep 5
          done

          echo "::error::$package is still missing from npm after explicit publish"
          exit 1
