# Standalone application configuration shared by supported pnpm versions.
#
# `packages: []` is intentional: this is one application, not a monorepo.
# pnpm 10.34.5+, 11 and 12 read engine/install policy from this file.
packages: []

engineStrict: true

# The template and its first-party integration ship in lockstep. Keep the
# supply-chain age policy for all third parties while allowing this exact
# version of our own integration to install on release day.
minimumReleaseAgeExclude:
  - '@cogito.ai/astryx-web@0.2.0 || 0.2.1'

allowBuilds:
  "@astryxdesign/cli": true
  "@astryxdesign/core": true
  better-sqlite3: false
  esbuild: true
  lightningcss: true
