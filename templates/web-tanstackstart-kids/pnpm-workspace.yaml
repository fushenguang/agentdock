# Standalone application configuration shared by supported pnpm versions.
#
# `packages: []` is intentional: this is one application, not a monorepo.
# pnpm 10.34.5+, 11 and 12 read engine/install policy from this file.
packages: []

engineStrict: true

allowBuilds:
  "@astryxdesign/cli": true
  "@astryxdesign/core": true
  better-sqlite3: false
  esbuild: true
  lightningcss: true
