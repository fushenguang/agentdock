# gates.yml — the three day-one CI gates for a skills-registry content repo.
#
# ① full skill validation   ② skills.json + docs freshness   ③ public/private boundary
#
# All three are plain Node ESM scripts (scripts/gates/*.mjs) — zero build step, so this
# workflow needs nothing beyond Node + pnpm + the pinned @cogito.ai/cli devDependency
# (design.md §3, §4). No `npx @cogito.ai/cli@latest` — a pinned version means this workflow's
# pass/fail is a function of what's in this repo, not of what shipped upstream today.

name: Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  gates:
    name: Skill gates (①②③)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate ① — full skill validation
        run: pnpm run gate:validate

      - name: Gate ② — manifest + docs freshness
        run: pnpm run gate:manifest-fresh

      - name: Gate ③ — public/private boundary
        run: pnpm run gate:public-boundary
