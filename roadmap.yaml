  # 由 @sunny 于 2026-08-12 明确授权 AI 代为添加（该文件受 CODEOWNERS 保护，Gate① 通常需人类 owner）。
  # 这是 thefoolai `skills-hub` 子roadmap 第 4 刀在本仓库的落点——按跨仓库治理约定，
  # hub 本体的 roadmap 条目与 openspec change 全部归 agentdock，thefoolai 侧只留一行链过来。
  # 参见 thefoolai `apps/wiki/content/docs/prd/skills-hub.mdx` §4。
  #
  # ⚠️ 状态刻意保持 planned 而非 in-progress：验收标准是「lesson-prep 发布 → 从 hub 装回来 →
  # 履历回流」，而履历数据由 thefoolai 的 skill-usage-attribution（第 3 刀）产出——该刀目前
  # 仅「代码完成」，分支未合并、未发版、账本零条真实记录。触发判据是「合并 + 生产运行一段
  # 时间后账本非零」，不是「第 3 刀写完了」。开工前请人工确认这一条已满足。
  - id: skills-hub-cli
    title: "Skills hub CLI + registry (L1 contract, detect/eval/publish, git-manifest registry)"
    # 2026-08-13：上方那条「开工前请人工确认账本非零」的门，构建者已在对话中明确放行。
    # 放行理由（留痕以免日后被误读为绕过门禁）：那条门要防的是「hub 带着空履历库上线、
    # 退回成又一个 skill 目录」，但履历是闭环跑起来之后的产物、不是它的前置条件——
    # 先有发布/获取/安装的通路，才谈得上积累履历。要求先有履历再建通路是把因果颠倒了。
    # 验收标准相应从「履历回流」改为「闭环真的跑通（发布→获取→安装→使用）」。
    # 首刀 cli-skill-publish 已立项（PR #26 已合）。
    # 2026-08-14：首刀阶段 0 排雷 + 阶段 1/2 实现 + 阶段 3 验收完成，待 Gate④ 人类合并。
    #   关键发现：唯一指定的验收样本 lesson-prep 因保留非规范顶层键 pipeline，
    #   必然通不过官方校验器 skills-ref——验收样本与验收标准互斥。
    #   裁决走 fail-closed 的前缀匹配降级（详见 changes/cli-skill-publish/design.md 3.1）。
    #   status 仍为 in-progress：本条目覆盖 detect/eval/publish 三者，本刀只交付 publish。
    status: in-progress
    owner: "@sunny"

  # 由 @sunny 于 2026-08-16 在对话中明确授权 AI 代为添加（本文件受 CODEOWNERS 保护，
  # Gate① 通常需人类 owner）。留痕以免日后被误读为绕过门禁。
  #
  # 为什么单独立条目、而不是挂在上面的 skills-hub-cli 下：skills-hub-cli 覆盖
  # detect/eval/publish 三项**能力交付**，范围宽且长期 in-progress；本条是一个
  # **会阻塞消费侧的正确性缺陷**，挂进去容易被当成"那一大条的一部分"而失焦。
  # 它是「skill 内容仓公开」的硬前置——不修则内容搬进公开仓后别人依然装不了。
  - id: publish-source-url-normalization
    title: "Normalize `source` URL in published manifests (SSH to HTTPS) so anonymous installs work"
    # 发现于 2026-08-16 归档 cli-skill-publish 时：用真实样本跑一次 publish 并**读产出物内容**
    # （而不是只看退出码），产出 "source": "git@github.com:fushenguang/thefoolai.git"。
    #
    # 根因：packages/cli/src/core/skillPublish.ts:87-99 把 `git remote get-url origin`
    # 的输出**零规范化**直接写入 source（第 110/173 行）。
    #
    # ★ 准确的表述不是「它输出 SSH」，而是——**同一个仓库、两个贡献者发布同一个 skill，
    #   会产出一个能匿名装、一个不能装的 manifest**。这是发布产物里的非确定性，
    #   且它对发布者本人不可见（他自己的 clone 一定能用）。
    #
    # 违反的护栏：消费侧「别家 Agent 拿到 git 地址就能直接装」。
    # 判据不是"URL 能被解析"，而是——**产出的 URL 能被一个没有任何凭据的人 clone**。
    #
    # 修法与完整证据见 changes/archive/2026-08-16-cli-skill-publish/design.md 末尾章节。
    status: planned
    owner: "@sunny"

  # 由 @sunny 于 2026-08-16 在对话中明确授权 AI 代为添加（本文件受 CODEOWNERS 保护，
  # Gate① 通常需人类 owner）。留痕以免日后被误读为绕过门禁。
  - id: skills-registry-template
    title: "Add a `skills-registry` project template (docs + gates, no marketing web app)"
    # 场景：初始化一个「公开 skill 内容仓」——skill 正典放 git、根目录一份 skills.json
    # manifest、一个 docs 站说明写法与约定。首个使用者是 thefoolai 的
    # `fushenguang/thefool-skills`（部署 skills.app.fujia.site），但模板本身通用：
    # 任何想建 skill hub 的人都需要同一套东西。
    #
    # 由 web-nextjs 派生，但三处刻意不同：
    #   ① 去掉 apps/web（营销站），只留 apps/docs（Fumadocs）
    #   ② 去掉 supabase —— skills-hub 的可移植性铁律明确不用它
    #   ③ openspec 收窄适用范围：只管基建/契约变更（manifest schema、校验规则、
    #      站点结构），**不管「加一个 skill」**。为产品代码库设计的门原样套到内容仓上，
    #      会让贡献一个 skill 需要先写 proposal —— 直接劝退贡献，包括劝退我们自己。
    #      加 skill 的门只有两条：`agentdock skill validate` 通过 + PR review。
    #
    # ★ 模板真正的价值不在脚手架，在它预置的三道门（详见 thefoolai
    #   prd/skill-commerce-loop §4.1.2）：
    #   1. 每个 PR 对**全部** skill 跑 `agentdock skill validate`（不是只跑改动的）
    #   2. `skills.json` **新鲜度门** —— CI 重新生成并对账。这条来自实证教训：
    #      2026-08-15/16 一轮里生成文件漂移咬了三次（knowledge-index 过期、
    #      roadmap↔archive 不同步、三个版本真源无人对账）。「一个 manifest + 一堆内容」
    #      是完全相同的漂移形态，day one 建门比事后补便宜一个数量级。
    #   3. 公私边界检查 —— 该类仓全部公开，禁止私有仓路径 / 内部域名 / 个人可识别模式。
    #      同样来自实证：2026-08-15 去标识化漏过一次（半脱敏但姓氏仍在）。
    #
    # 另：skill 目录索引不做独立浏览 UI —— 由 skills.json 生成 docs 页即可，
    # 避免维护两套渲染。
    status: planned
    owner: "@sunny"

  # 由 @sunny 于 2026-08-17 在对话中明确授权 AI 代为添加（本文件受 CODEOWNERS 保护）。
  # 原话是「其它的按你的建议出来」，指的是我在上一轮结尾列出的三条待裁决项，
  # 其中两条落成本文件的两个新条目。留痕以免日后被误读为绕过门禁。
  - id: web-nextjs-npmrc-fix
    title: "Fix `.npmrc` string-form `only-built-dependencies` that breaks CI in any scaffolded repo"
    # 发现于 2026-08-17：用 skills-registry 模板真建了第一个仓，它的 CI 第一跑就挂在
    # pnpm/action-setup，三道门全部 skipped。
    #
    # 根因：模板 `.npmrc` 里 `only-built-dependencies = a,b,c`。`.npmrc` 只能存字符串，
    # pnpm 把它映射成 onlyBuiltDependencies 的**字符串**，而 action-setup 的
    # self-installer 对它调 `.sort()` → `ERROR onlyBuiltDependencies?.sort is not a function`。
    # 真源应保留 package.json 的 `pnpm.onlyBuiltDependencies`（数组）一份。
    #
    # ★ `templates/web-nextjs/.npmrc` 有**完全相同的一行**。skills-registry 那份已在
    #   PR #35 修掉；web-nextjs 当时属该刀 Non-goal，只登记未修（其 tasks 6.4）。
    #
    # 为什么至今没人撞到：**没有任何工作流会 scaffold web-nextjs 并在产物里跑
    # `pnpm install`**。它是一条从未被真实 CI 跑过的路径——"没人跑过"和"跑过且通过"
    # 在仪表盘上是同一个绿色（详见 thefoolai wiki `engineering/false-green-gates` 失效七）。
    status: planned
    owner: "@sunny"

  - id: skill-license-provenance-gate
    title: "Add a license/provenance gate to the skills-registry template"
    # 发现于 2026-08-17 建 thefool-skills 时：门③（公私边界）筛掉 6 个泄漏宿主身份的 skill
    # 之后，剩下 8 个"干净"。但那**只是身份维度**。逐个查许可后发现其中 5 个不是自有内容：
    #   - 2 个是供应商专有（`© <vendor>. All rights reserved.`）——任何情况下不能进公开 MIT 仓
    #   - 3 个是 Apache-2.0——可转发但必须保留原许可与 NOTICE，**不能改 MIT**
    # 最终只有 3 个能按 MIT 发布。
    #
    # ★ 这是**产品缺口不是操作失误**：三道门回答的是"合不合法（spec）/新不新鲜/
    #   有没有泄漏我的身份"，**没有一道回答"我有没有权利发布它"**。
    #   而内容仓的全部意义就是发布。
    #
    # 门要查的最小集：skill 目录内的 LICENSE/NOTICE 文件、frontmatter 的 `license` 字段、
    # 正文里的版权声明形状；与仓库声明的许可不兼容时失败，并指出是哪个 skill、哪个证据。
    # 判据不是"能识别 SPDX"，而是——**能拦住一次把别人的专有内容推成公开 MIT 的提交**。
    status: planned
    owner: "@sunny"

