next:
  - id: cli-mvp-scaffolder
    title: "Scaffold CLI MVP (agentdock init + agentdock mcp, dual-mode human/agent)"
    status: done
    owner: "@sunny"

  # 由 @sunny 于 2026-08-12 明确授权 AI 代为添加（该文件受 CODEOWNERS 保护，Gate① 通常需人类 owner）。
  # 这是 thefoolai `skills-hub` 子roadmap 第 4 刀在本仓库的落点——按跨仓库治理约定，
  # hub 本体的 roadmap 条目与 openspec change 全部归 agentdock，thefoolai 侧只留一行链过来。
  # 参见 thefoolai `apps/wiki/content/docs/prd/skills-hub.mdx` §4。
  #
  # ⚠️ 状态刻意保持 planned 而非 in-progress：验收标准是「lesson-prep 发布 → 从 hub 装回来 →
  # 履历回流」，而履历数据由 thefoolai 的 skill-usage-attribution（第 3 刀）产出——该刀目前
  # 仅「代码完成」，分支未合并、未发版、账本零条真实记录。触发判据是「合并 + 生产运行一段
  # 时间后账本非零」，不是「第 3 刀写完了」。开工前请人工确认这一条已满足。
  - id: skills-hub-cli
    title: "Skills hub CLI + registry (L1 contract, detect/eval/publish, git-manifest registry)"
    # 2026-08-13：上方那条「开工前请人工确认账本非零」的门，构建者已在对话中明确放行。
    # 放行理由（留痕以免日后被误读为绕过门禁）：那条门要防的是「hub 带着空履历库上线、
    # 退回成又一个 skill 目录」，但履历是闭环跑起来之后的产物、不是它的前置条件——
    # 先有发布/获取/安装的通路，才谈得上积累履历。要求先有履历再建通路是把因果颠倒了。
    # 验收标准相应从「履历回流」改为「闭环真的跑通（发布→获取→安装→使用）」。
    # 首刀 cli-skill-publish 已立项（PR #26 已合）。
    # 2026-08-14：首刀阶段 0 排雷 + 阶段 1/2 实现 + 阶段 3 验收完成，待 Gate④ 人类合并。
    #   关键发现：唯一指定的验收样本 lesson-prep 因保留非规范顶层键 pipeline，
    #   必然通不过官方校验器 skills-ref——验收样本与验收标准互斥。
    #   裁决走 fail-closed 的前缀匹配降级（详见 changes/cli-skill-publish/design.md 3.1）。
    #   status 仍为 in-progress：本条目覆盖 detect/eval/publish 三者，本刀只交付 publish。
    status: in-progress
    owner: "@sunny"

  # 由 @sunny 于 2026-08-16 在对话中明确授权 AI 代为添加（本文件受 CODEOWNERS 保护，
  # Gate① 通常需人类 owner）。留痕以免日后被误读为绕过门禁。
  #
  # 为什么单独立条目、而不是挂在上面的 skills-hub-cli 下：skills-hub-cli 覆盖
  # detect/eval/publish 三项**能力交付**，范围宽且长期 in-progress；本条是一个
  # **会阻塞消费侧的正确性缺陷**，挂进去容易被当成"那一大条的一部分"而失焦。
  # 它是「skill 内容仓公开」的硬前置——不修则内容搬进公开仓后别人依然装不了。
  - id: publish-source-url-normalization
    title: "Normalize `source` URL in published manifests (SSH to HTTPS) so anonymous installs work"
    # 发现于 2026-08-16 归档 cli-skill-publish 时：用真实样本跑一次 publish 并**读产出物内容**
    # （而不是只看退出码），产出 "source": "git@github.com:fushenguang/thefoolai.git"。
    #
    # 根因：packages/cli/src/core/skillPublish.ts:87-99 把 `git remote get-url origin`
    # 的输出**零规范化**直接写入 source（第 110/173 行）。
    #
    # ★ 准确的表述不是「它输出 SSH」，而是——**同一个仓库、两个贡献者发布同一个 skill，
    #   会产出一个能匿名装、一个不能装的 manifest**。这是发布产物里的非确定性，
    #   且它对发布者本人不可见（他自己的 clone 一定能用）。
    #
    # 违反的护栏：消费侧「别家 Agent 拿到 git 地址就能直接装」。
    # 判据不是"URL 能被解析"，而是——**产出的 URL 能被一个没有任何凭据的人 clone**。
    #
    # 修法与完整证据见 changes/archive/2026-08-16-cli-skill-publish/design.md 末尾章节。
    status: planned
    owner: "@sunny"

